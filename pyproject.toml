[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-aws-reference"
version = "0.1.0"
description = "Reference MLOps pipeline: Airflow DAG training a PyTorch credit-risk model, DVC data versioning, MLflow tracking and registry, Evidently drift alerts, a PySpark feature job, a canary router and AWS Terraform."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "mlflow>=3.0",
  "evidently>=0.7,<0.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=3.0"]
spark = ["pyspark>=3.5"]
dvc = ["dvc>=3.50"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
mlops-ref = "mlops_ref.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "spark: needs pyspark and a Java runtime",
  "airflow: needs apache-airflow",
  "dvc: needs the dvc CLI",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
